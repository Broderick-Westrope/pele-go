name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly long fuzz, 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every V8 check fails rather than skips when node is missing.
  PELE_REQUIRE_NODE: "1"
  # The V8 oracle loads the vendored bundle in internal/oracle/testdata; no npm install.
  NODE_VERSION: "22"

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: go test -race
        run: go test -race -timeout 30m ./...

  # raster is a nested module, so the root jobs' ./... doesn't reach it.
  raster:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest Go raster/go.mod allows on each OS wazero compiles
        # natively for, and the newest stable Go on Linux.
        include:
          - os: ubuntu-latest
            go-version-file: raster/go.mod
            min-go: true
          - os: macos-latest
            go-version-file: raster/go.mod
            min-go: true
          - os: windows-latest
            go-version-file: raster/go.mod
            min-go: true
          - os: ubuntu-latest
            go-version: stable
            min-go: false
    env:
      # Races don't depend on the OS, and the detector slows tests several
      # times over, so only Linux runs it.
      RACE: ${{ matrix.os == 'ubuntu-latest' && '-race' || '' }}
      MIN_GO_LINUX: ${{ matrix.os == 'ubuntu-latest' && matrix.min-go }}
    defaults:
      run:
        shell: bash
        working-directory: raster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
          cache-dependency-path: raster/go.sum
      - name: go mod tidy
        if: env.MIN_GO_LINUX == 'true'
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      # A pinned staticcheck can't always analyse the newest Go.
      - name: staticcheck
        if: env.MIN_GO_LINUX == 'true'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: go test
        run: go test $RACE -timeout 15m ./...
      # GOTOOLCHAIN matches go.mod's go line today; it keeps this step on
      # the minimum if a toolchain line is ever added.
      - name: Build tests with Go 1.26.0 and no cgo
        if: env.MIN_GO_LINUX == 'true'
        env:
          GOTOOLCHAIN: go1.26.0
          CGO_ENABLED: "0"
        run: go test -c -o "$RUNNER_TEMP/" ./...
      # raster/go.mod pins a tagged pele-go, so this warns when the root at
      # this commit would break raster once tagged. It can't gate: a root
      # change and raster's fix for it land in separate releases.
      - name: go test against pele-go at this commit
        if: env.MIN_GO_LINUX == 'true'
        continue-on-error: true
        run: |
          go work init .. .
          if ! { go vet ./... && go test ./...; }; then
            echo "::warning::raster fails against pele-go at this commit; it will need a fix before the next root tag is bumped into raster/go.mod"
            exit 1
          fi

  fuzz-smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParity, FuzzParityV8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Fuzz every type for 10s
        run: scripts/fuzz-all.sh ${{ matrix.target }} 10s
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-smoke-${{ matrix.target }}
          path: testdata/fuzz

  fuzz-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParity, FuzzParityV8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Fuzz every type for 60s
        run: scripts/fuzz-all.sh ${{ matrix.target }} 60s
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-nightly-${{ matrix.target }}
          path: testdata/fuzz
